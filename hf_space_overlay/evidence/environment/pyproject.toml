[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[project]
name = "trace-claim-reproduction"
version = "0.1.0"
description = "CPU-only claim-by-claim reproduction of TRACE (arXiv:2601.21135)"
requires-python = ">=3.8,<3.9"
dependencies = [
  "h5py==3.11.0",
  "ipdb==0.13.13",
  "matplotlib==3.7.5",
  "numpy==1.24.4",
  "opencv-python-headless==4.10.0.84",
  "pymunk==6.6.0",
  "pytorch-lightning==2.0.9",
  "pyyaml==6.0.1",
  "scikit-learn==1.3.2",
  "scipy==1.10.1",
  "tensorboard==2.14.0",
  "torch==2.0.1",
  "torchvision==0.15.2",
]

[tool.hatch.build.targets.wheel]
packages = ["trace_repro"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

