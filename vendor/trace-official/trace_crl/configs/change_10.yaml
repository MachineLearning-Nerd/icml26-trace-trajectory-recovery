#########################
# Model Configurations  #
#########################

ROOT: './datasets'
LOG: './log'
DATASET: '10_domains'

VAE:
    GPU: [0, 1]
    CPU: 8
    TRAIN_BS: 64
    VAL_BS: 256
    EPOCHS: 100
    N_VAL_SAMPLES: 2048
    NCLASS: 10
    LAG: 2
    LENGTH: 1
    EMBED_DIM: 8
    INFER_MODE: 'F'
    TRANS_PRIOR: 'NP'
    LR: 5.0e-4
    BETA: 2.0e-3
    GAMMA: 2.0e-2
    INPUT_DIM: 8
    LATENT_DIM: 8
    BIAS: FALSE
    ENC:
        HIDDEN_DIM: 128
    DEC:
        HIDDEN_DIM: 128
        DIST: 'gaussian'
    PIN: TRUE

MCC:
    FREQ: 0.1
    CORR: 'Pearson' # 'Spearman'
