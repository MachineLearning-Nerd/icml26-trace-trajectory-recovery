<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Measured CPU feasibility for exact TRACE training</title>
  <desc id="desc">The exact K5 run completed in 3.086 hours while K10 projects to 295 hours.</desc>
  <rect width="1100" height="560" rx="20" fill="#101827"/>
  <text x="70" y="68" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">Exact CPU training: one claim fits, one does not</text>
  <text x="70" y="108" fill="#9fb0c8" font-family="Inter,Arial,sans-serif" font-size="18">Measured released-code throughput · 100 epochs · no GPU</text>
  <line x1="280" y1="170" x2="1010" y2="170" stroke="#607089" stroke-width="2"/>
  <g stroke="#26364d" stroke-width="1">
    <line x1="405" y1="170" x2="405" y2="450"/>
    <line x1="655" y1="170" x2="655" y2="450"/>
    <line x1="905" y1="170" x2="905" y2="450"/>
  </g>
  <g fill="#8fa0b7" font-family="Inter,Arial,sans-serif" font-size="15" text-anchor="middle">
    <text x="280" y="482">0 h</text>
    <text x="405" y="482">50 h</text>
    <text x="655" y="482">150 h</text>
    <text x="905" y="482">250 h</text>
  </g>
  <g fill="#dce7f5" font-family="Inter,Arial,sans-serif" font-size="20" text-anchor="end">
    <text x="255" y="250">K=5 learned run</text>
    <text x="255" y="370">K=10 ablation</text>
  </g>
  <rect x="280" y="218" width="12" height="52" rx="6" fill="#34d399"/>
  <rect x="280" y="338" width="713" height="52" rx="9" fill="#ff6b6b"/>
  <line x1="338" y1="190" x2="338" y2="424" stroke="#fbbf24" stroke-width="4" stroke-dasharray="8 7"/>
  <text x="338" y="206" fill="#fbbf24" font-family="Inter,Arial,sans-serif" font-size="15" text-anchor="middle">24 h job window</text>
  <g fill="#f8fafc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="21" font-weight="700">
    <text x="305" y="252">3.086 h actual</text>
    <text x="972" y="372" text-anchor="end">≈295 h</text>
  </g>
  <text x="70" y="525" fill="#9fb0c8" font-family="Inter,Arial,sans-serif" font-size="16">K=5 is the terminal equivalent-Jacobian run; K=10 uses 134 measured batches of 6,218/epoch.</text>
</svg>
