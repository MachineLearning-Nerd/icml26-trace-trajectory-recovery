<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Exact Theorem 4.3 counterexample</title>
  <desc id="desc">The exact estimator risk is positive while the displayed theorem right hand side is zero.</desc>
  <rect width="1100" height="560" rx="20" fill="#101827"/>
  <text x="70" y="72" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">Theorem 4.3 counterexample: positive risk, zero bound</text>
  <text x="70" y="112" fill="#9fb0c8" font-family="Inter,Arial,sans-serif" font-size="19">Constant path · T = 64 · σ = 0.5 · exact assumption audit</text>
  <line x1="310" y1="166" x2="1010" y2="166" stroke="#314158" stroke-width="2"/>
  <line x1="310" y1="166" x2="310" y2="446" stroke="#607089" stroke-width="2"/>
  <g fill="#8fa0b7" font-family="Inter,Arial,sans-serif" font-size="15">
    <text x="304" y="475" text-anchor="middle">0</text>
    <text x="498" y="475" text-anchor="middle">0.01</text>
    <text x="692" y="475" text-anchor="middle">0.02</text>
    <text x="886" y="475" text-anchor="middle">0.03</text>
  </g>
  <g stroke="#26364d" stroke-width="1">
    <line x1="498" y1="166" x2="498" y2="446"/>
    <line x1="692" y1="166" x2="692" y2="446"/>
    <line x1="886" y1="166" x2="886" y2="446"/>
  </g>
  <g fill="#dce7f5" font-family="Inter,Arial,sans-serif" font-size="20">
    <text x="286" y="226" text-anchor="end">Exact expected MSE</text>
    <text x="286" y="316" text-anchor="end">Noise-mode lower bound</text>
    <text x="286" y="406" text-anchor="end">Displayed RHS</text>
  </g>
  <rect x="310" y="194" width="661" height="48" rx="8" fill="#ff6b6b"/>
  <rect x="310" y="284" width="76" height="48" rx="8" fill="#fbbf24"/>
  <rect x="310" y="374" width="3" height="48" rx="1" fill="#38bdf8"/>
  <g fill="#f8fafc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" font-weight="700">
    <text x="950" y="225" text-anchor="end">0.0340467</text>
    <text x="400" y="315">0.00390625</text>
    <text x="326" y="405">0</text>
  </g>
  <text x="70" y="525" fill="#9fb0c8" font-family="Inter,Arial,sans-serif" font-size="16">Independent 20,000-run estimate of preserved mode: 0.0039661 ± 0.0000405 SE</text>
</svg>
